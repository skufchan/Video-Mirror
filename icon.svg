<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#8B6CFF"></stop>
            <stop offset="100%" stop-color="#4B2CE8"></stop>
        </linearGradient>

        <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="blur"></feGaussianBlur>
            <feMerge>
                <feMergeNode in="blur"></feMergeNode>
                <feMergeNode in="SourceGraphic"></feMergeNode>
            </feMerge>
        </filter>
    </defs>

    <!-- Background -->
    <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"></rect>

    <!-- Mirror symbol -->
    <g fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
        <!-- Left arrow -->
        <path d="M54 42 L30 64 L54 86"></path>
        <path d="M30 64 H72"></path>

        <!-- Right arrow -->
        <path d="M74 42 L98 64 L74 86"></path>
        <path d="M98 64 H56"></path>
    </g>
</svg>